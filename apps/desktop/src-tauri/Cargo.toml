[package]
name = "agentic"
version = "0.1.0"
description = "agentic.harness — native multi-model agent workspace"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
