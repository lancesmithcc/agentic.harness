<!doctype html>
<html lang="en" data-theme="gold">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentic.sidekick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0908'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FB923C'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/brand.css" />
<style>
  /* Primary per-chat control: large enough for touch and distinct when enabled. */
  /* 🧬 sits beside the theme toggle; it opens a self-evolve chat rooted in the harness source. */
  .rail-actions{display:flex;align-items:center;gap:6px;flex:none}
  #selfEvolveToggle{font-size:15px;line-height:1}
  #selfEvolveToggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .self-chat-options-wrap{display:inline-flex;align-items:center;gap:2px}
  #selfChatDetails{color:var(--text-dim);font-size:12px}
  #selfChatDetails summary{cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:18px;min-height:32px;list-style:none;white-space:nowrap}
  #selfChatDetails summary::-webkit-details-marker{display:none}
  /* floats above the rail (which clips overflow); placed next to the ▾ when opened */
  #selfChatOptions{position:fixed;z-index:70;width:min(440px,calc(100vw - 48px));max-height:55vh;overflow:auto;padding:16px;background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow)}
  #selfChatOptions[hidden]{display:none}
  #selfChatOptions .source-path{display:flex;gap:8px;margin-top:12px}
  #selfSourcePath{min-width:0;flex:1;padding:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px}
  #selfChatDetails summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
</style>
<script>
  // Running inside the Agentic desktop app: make room for the macOS traffic lights.
  if (/AgenticHarness\//.test(navigator.userAgent)) document.documentElement.classList.add("native-mac");
</script>
</head>
<body>
<!--
THESIS: a model-orchestration cockpit — Claude Code's earned familiarity, worn in the agentic.lancesmith.cc world (amber on near-black; inverse terracotta on sand). Refuses the generic dark-chat default.
OWN-WORLD: Fraunces display + Inter UI, hand-drawn robot swarm field under a readability veil, amber accent #FB923C (inverse #C2410C), pill buttons, the signature dot pulses while the fleet thinks.
STORY: the operator asks; the harness names the mind it chose, shows it thinking in the hypersentient register, and falls back live; the fleet is managed in place.
FIRST VIEWPORT: left rail (brand, new session, nav, profile+theme) + conversation column with fleet chips up top; composer anchors the bottom, AUTO routing implied.
FORM: user-pinned Claude Code-style operator shell; seed: pinned-brand extension of the DeepHarness web client.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="ambient" aria-hidden="true"><div class="glow"></div><svg class="grain" width="0" height="0"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter></svg></div>

<div class="noised" aria-hidden="true"></div>
<div class="robots" aria-hidden="true"></div>
<div class="app" id="app" data-busy="0">
  <aside class="rail" id="mobileDrawer">
    <div class="drag-strip" data-tauri-drag-region></div>
    <div class="brand">
      <a class="signature signature--compact" id="brandSig" href="#" title="agentic.sidekick" aria-label="agentic.sidekick home">
        <span class="signature-prefix">agentic</span><span class="signature-dot">.</span><span class="signature-domain" id="sigDomain"></span><span class="signature-cursor">|</span>
      </a>
    </div>
    <button class="newsession" id="newSession" type="button">New session</button>
    <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation menu" aria-controls="mobileDrawer" aria-expanded="false">Menu</button>
    <div class="nav-section-label" style="padding:0 10px;">History</div>
    <div id="chatList" class="chatlist"></div>
    <nav class="nav" id="nav">
      <div class="nav-section-label">Workspace</div>
      <button class="nav-item active" data-view="chat" type="button">Conversation</button>
      <button class="nav-item" data-view="routines" type="button">Routines</button>
      <button class="nav-item" data-view="artifacts" type="button">Artifacts</button>
      <div class="nav-section-label">Fleet</div>
      <button class="nav-item" data-view="skills" type="button">Skills</button>
      <button class="nav-item" data-view="tools" type="button">Tools &amp; MCP</button>
      <div class="nav-section-label">System</div>
      <button class="nav-item" data-view="settings" type="button">Settings</button>
    </nav>
    <div class="rail-footer">
      <span class="profile-pill" id="profilePill">home</span>
      <div class="rail-actions">
        <div class="self-chat-options-wrap">
          <button class="theme-toggle" id="selfEvolveToggle" type="button" aria-label="Start a self-evolve chat" title="Self-evolve: new chat in the harness source" aria-pressed="false">🧬</button>
          <details id="selfChatDetails"><summary title="Self-evolve options" aria-label="Self-evolve options">▾</summary></details>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle colour theme" title="Invert the field" type="button">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <section class="main">
    <header class="topbar" data-tauri-drag-region>
      <button class="ws-btn" id="wsBtn" type="button" title="Choose working folder">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 4.2c0-.7.6-1.3 1.3-1.3h3.1l1.4 1.6h5.9c.7 0 1.3.6 1.3 1.3v6.7c0 .7-.6 1.3-1.3 1.3H2.8c-.7 0-1.3-.6-1.3-1.3V4.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span id="wsName">~</span>
      </button>
      <span class="crumb" id="crumb">Conversation</span>
      <div class="header-right">
        <div class="pills" id="pills"></div>
        <div class="fleet-chips" id="chips"></div>
      </div>
    </header>
    <div id="view"></div>

    <footer class="composer" id="composer">
      <div class="composer-inner">
        <div class="queue-tray" id="queueTray" hidden></div>
        <div class="attach-tray" id="attachTray" hidden></div>
        <textarea id="task" rows="1" aria-label="Task for agentic.sidekick" placeholder="how shall we proceed creator?"></textarea>
        <div class="composer-bar">
          <button class="attach-btn" id="attachBtn" type="button" aria-label="Attach files" title="Attach files — or drop / paste them into the box">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.2 7.6 8 12.8a3.4 3.4 0 0 1-4.8-4.8l5.5-5.5a2.3 2.3 0 0 1 3.2 3.2L6.4 11.2a1.1 1.1 0 0 1-1.6-1.6L9.6 4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="fileInput" multiple hidden />
          <button class="modelpick" id="modelPick" type="button" aria-label="Choose model" aria-haspopup="menu" aria-expanded="false" title="Choose the model for this task"><span class="mp-k">AUTO</span><span class="mp-caret">▾</span></button>
          <div class="modelmenu" id="modelMenu" hidden></div>
          <select id="pin" hidden><option value="">AUTO</option></select>
          <label class="chk" title="Delegate: if the chosen model fails or rate-limits, the harness continues with the next model in the chain. Uncheck to stay strictly on the selected model."><input type="checkbox" id="delegate" checked /> delegate</label>
          <label class="chk" title="Escalate: start one tier up the capability ladder — skips local/cheap models so the task opens on a stronger mind."><input type="checkbox" id="escalate" /> escalate</label>
          <label class="chk astra-only" hidden title="Orchestrator job: marks this call as conducting the fleet (planning/arbitration), which is the only role GPT 6 Astra may fill — and only after its Settings gate is on."><input type="checkbox" id="orchestrator" /> orchestrator job</label>
          <span class="spacer"></span>
          <button class="btn-send" id="send" type="button">Send</button>
          <button class="btn-steer" id="steer" type="button" hidden title="Stop the current reply now and send this as a course correction — the partial reply is kept in the thread">Steer</button>
          <button class="btn-queue" id="queue" type="button" hidden title="Run this after the current reply finishes">Queue</button>
          <button class="btn-stop" id="stop" type="button" hidden>Stop generating</button>
        </div>
      </div>
    </footer>
  </section>
</div>

<div class="overlay" id="fsOverlay" hidden>
  <div class="fsdialog" role="dialog" aria-modal="true" aria-labelledby="fsTitle">
    <h3 id="fsTitle">Choose a working folder</h3>
    <div class="fscrumb" id="fsCrumb"></div>
    <div class="fslist" id="fsList"></div>
    <div class="fsfoot">
      <button class="ghost" id="fsHome" type="button">Home</button>
      <span class="fspath" id="fsPath"></span>
      <span class="spacer"></span>
      <button class="ghost" id="fsCancel" type="button">Cancel</button>
      <button class="btn-send" id="fsChoose" type="button">Choose this folder</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var S = { profile: null, sessionId: null, busy: false, abort: null, activeTurn: null, turnSeq: 0, loadSeq: 0, listSeq: 0, statusSeq: 0, themeSeq: 0, verbs: [], verbTimer: null,
            models: [], settings: { astraAvailable: false, theme: "gold" }, view: "chat",
            status: null, meta: {}, workspace: null, defaultWorkspace: null, selfEvolve: false, fsDir: null, themePinned: false, bootSeq: 0, contextSeq: 0, contextSaving: false };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function clean(s) { return String(s || "").replace(/\*\*/g, "").replace(/⭐/g, "").trim(); }
  function qs() { return S.profile ? "?profile=" + encodeURIComponent(S.profile) : ""; }
  function get(url) { return fetch(url).then(function (r) { return r.json(); }); }

  // ---------- theme ----------
  // "Show reasoning" also governs folds already on screen: turning it off in the
  // middle of a conversation must hide the thinking that streamed before it.
  function applyReasoning() {
    document.documentElement.dataset.reasoning = S.settings.reasoningOff ? "off" : "on";
  }

  function applyTheme(t, userAction) {
    document.documentElement.dataset.theme = t;
    S.settings.theme = t;
    function syncInverseInk() {
      var ink = document.documentElement.dataset.theme === "inverse" ? "#1A1817" : "";
      $("brandSig").style.setProperty("color", ink, "important");
      $("profilePill").style.setProperty("color", ink, "important");
      Array.prototype.forEach.call(document.querySelectorAll("#brandSig *, .nav-item:not(.active), .turn-actions .ghost"), function (node) { node.style.setProperty("color", ink, "important"); });
    }
    syncInverseInk(); setTimeout(syncInverseInk, 0);
    if (userAction) { S.themeSeq++; S.themePinned = true; }
  }
  $("themeToggle").onclick = function () {
    var t = S.settings.theme === "gold" ? "inverse" : "gold";
    applyTheme(t, true);
    fetch("/api/settings", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ theme: t }) }).catch(function () {});
  };

  // ---------- navigation ----------
  function setView(v) {
    S.view = v;
    document.querySelectorAll(".nav-item").forEach(function (n) { n.classList.toggle("active", n.dataset.view === v); });
    $("crumb").textContent = v === "chat" ? "Conversation" : v.charAt(0).toUpperCase() + v.slice(1);
    $("composer").style.display = v === "chat" ? "" : "none";
    renderView();
  }
  document.querySelectorAll(".nav-item").forEach(function (n) {
    n.onclick = function () { setView(n.dataset.view); closeMobileMenu(); };
  });
  function closeMobileMenu() {
    document.querySelector(".rail").classList.remove("mobile-open");
    $("mobileMenu").setAttribute("aria-expanded", "false");
    $("mobileMenu").setAttribute("aria-label", "Open navigation menu");
  }
  $("mobileMenu").onclick = function () {
    var rail = document.querySelector(".rail"), open = !rail.classList.contains("mobile-open");
    rail.classList.toggle("mobile-open", open);
    $("mobileMenu").setAttribute("aria-expanded", String(open));
    $("mobileMenu").setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
    if (open) setTimeout(function () { $("newSession").focus(); }, 0);
  };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMobileMenu(); });
  function detachActiveTurn() {
    // A queued follow-up belongs to the conversation being left behind — drop it.
    if (S.queue.length) { S.queue = []; renderQueue(); }
    if (!S.activeTurn) return;
    S.activeTurn.detached = true;
    S.activeTurn.think.stop();
    S.activeTurn = null;
    S.abort = null;
    setBusy(false);
  }
  // A fresh conversation: clear the thread (the server opens a new session on the next send).
  // A reply still streaming keeps saving to its own session in the background.
  $("newSession").onclick = function () {
    // Keep an in-flight turn durable, but detach it from this fresh view. Its
    // immutable turn object continues to own its session and stream callbacks.
    detachActiveTurn();
    S.bootSeq++; invalidateContext(); S.loadSeq++;
    S.sessionId = null;
    S.workspace = S.defaultWorkspace; S.selfEvolve = false; refreshChatContext();
    S.fresh = true;
    feed.textContent = "";
    setView("chat");
    loadChatList();
    $("task").focus();
  };

  function renderView() {
    var v = $("view");
    v.textContent = "";
    if (S.view === "chat") v.appendChild(chatPage());
    else if (S.view === "routines") routinesPage(v);
    else if (S.view === "artifacts") artifactsPage(v);
    else if (S.view === "skills") skillsPage(v);
    else if (S.view === "tools") toolsPage(v);
    else if (S.view === "settings") settingsPage(v);
  }

  // ---------- chat ----------
  var feed = el("div"); // survives view switches — conversation history persists
  function chatPage() {
    var page = el("div", "chatpage");
    page.appendChild(feed);
    return page;
  }
  function isFollowing() {
    var view = $("view");
    return S.view === "chat" && view.scrollHeight - view.scrollTop - view.clientHeight < 120;
  }
  function followIfNeeded(wasFollowing) { if (wasFollowing) $("view").scrollTop = $("view").scrollHeight; }
  function sysline(text, cls) { var following = isFollowing(); feed.appendChild(el("div", "sys " + (cls || ""), text)); followIfNeeded(following); }
  function thinkingLine() {
    var line = el("div", "thinking-line");
    var mark = el("span", "thinking-mark");
    var txt = el("span", null, S.verbs[0] || "Crystallizing");
    line.appendChild(mark); line.appendChild(txt);
    feed.appendChild(line);
    var i = 0, timer = setInterval(function () { i = (i + 1) % S.verbs.length; txt.textContent = S.verbs[i]; }, 2200);
    return { line: line, stop: function () { clearInterval(timer); line.remove(); } };
  }

  // ---------- attachments ----------
  S.attachments = [];
  function fmtSize(n) {
    return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB" : (n / 1048576).toFixed(1) + " MB";
  }
  function renderTray() {
    var tray = $("attachTray"); tray.textContent = "";
    tray.hidden = !S.attachments.length;
    S.attachments.forEach(function (a, i) {
      var chip = el("span", "attach-chip" + (a.error ? " err" : ""));
      chip.appendChild(el("span", "attach-name", a.name));
      chip.appendChild(el("span", "attach-size", a.error || fmtSize(a.size)));
      var x = el("button", "attach-x", "✕"); x.type = "button"; x.title = "Remove"; x.setAttribute("aria-label", "Remove " + a.name);
      x.onclick = function () { S.attachments.splice(i, 1); renderTray(); };
      chip.appendChild(x);
      tray.appendChild(chip);
    });
    if (typeof updateComposerButtons === "function") updateComposerButtons();
  }
  function addFiles(list) {
    Array.prototype.forEach.call(list || [], function (f) {
      if (f.size > 25 * 1024 * 1024) S.attachments.push({ file: null, name: f.name, size: f.size, error: "over 25 MB" });
      else S.attachments.push({ file: f, name: f.name || "pasted-file", size: f.size });
    });
    renderTray();
  }

  // ---------- steer / queue ----------
  // A session runs one turn at a time (the server rejects overlaps). While a turn
  // streams, extra requests wait in S.queue and drain as follow-up turns in the
  // same session. "Steer" jumps the line by stopping the live turn first.
  S.queue = [];
  function renderQueue() {
    var tray = $("queueTray"); tray.textContent = "";
    tray.hidden = !S.queue.length;
    S.queue.forEach(function (q, i) {
      var chip = el("span", "queue-chip" + (q.steer ? " steer" : ""));
      chip.appendChild(el("span", "queue-tag", q.steer ? "steer" : "queued"));
      chip.appendChild(el("span", "queue-text", q.task || (q.files.length ? q.files.length + " file(s)" : "")));
      var x = el("button", "attach-x", "✕"); x.type = "button"; x.title = "Remove from queue"; x.setAttribute("aria-label", "Remove queued request");
      x.onclick = function () { S.queue.splice(i, 1); renderQueue(); };
      chip.appendChild(x);
      tray.appendChild(chip);
    });
  }
  function composerPayload() {
    return { task: $("task").value.trim(), files: S.attachments.filter(function (a) { return a.file; }) };
  }
  function clearComposer() {
    $("task").value = ""; S.attachments = []; renderTray(); updateComposerButtons();
  }
  function enqueueTurn(front) {
    var p = composerPayload();
    if (!p.task && !p.files.length) return false;
    var item = { task: p.task, files: p.files, steer: !!front };
    if (front) S.queue.unshift(item); else S.queue.push(item);
    clearComposer(); renderQueue();
    return true;
  }
  function steerTurn() {
    if (!S.busy) return;
    // Front-load this request, then stop the live turn. Its finalizer drains the
    // queue, so the steer message runs next — the server never sees an overlap.
    if (!enqueueTurn(true)) return;
    stopActiveTurn();
  }
  function drainQueue() {
    if (S.busy || !S.queue.length) return;
    var next = S.queue.shift(); renderQueue();
    startTurn({ task: next.task, files: next.files });
  }
  function refreshChatContext() {
    $("wsName").textContent = wsLabel(S.workspace || S.defaultWorkspace);
    $("wsBtn").title = S.workspace || S.defaultWorkspace || "~";
    var b = $("selfEvolveToggle"); b.setAttribute("aria-pressed", String(!!S.selfEvolve)); b.classList.toggle("active", !!S.selfEvolve);
  }
  function setContextBusy(busy) {
    S.contextSaving = busy;
    $("send").disabled = busy;
    $("wsBtn").disabled = busy || S.busy;
    $("selfEvolveToggle").disabled = busy || S.busy;
  }
  function invalidateContext() {
    S.contextSeq++;
    $("selfChatDetails").open = false;
    setContextBusy(false);
  }
  function saveSessionContext(change) {
    var profile = S.profile, prior = S.sessionId, seq = ++S.contextSeq;
    setContextBusy(true);
    var body = { sessionId: prior || undefined, workspace: change.workspace === undefined ? undefined : change.workspace, selfEvolve: change.selfEvolve === undefined ? undefined : change.selfEvolve };
    return jsonReq("PUT", "/api/session/context" + (profile ? "?profile=" + encodeURIComponent(profile) : ""), body).then(function (d) {
      if (seq !== S.contextSeq || profile !== S.profile || (prior !== S.sessionId && prior)) return d;
      if (d.error) throw new Error(d.error);
      S.sessionId = d.session; S.workspace = d.workspace; S.selfEvolve = !!d.selfEvolve; S.fresh = false;
      refreshChatContext(); loadChatList(profile); return d;
    }).catch(function (err) { if (seq === S.contextSeq) sysline("⚠ " + err.message, "error"); throw err; }).finally(function () { if (seq === S.contextSeq) setContextBusy(false); });
  }
  function uploadAttachments(files, profile, sessionId, workspace) {
    return Promise.all(files.map(function (a) {
      if (a.path) return a;
      var q = "/api/upload?name=" + encodeURIComponent(a.name) + (profile ? "&profile=" + encodeURIComponent(profile) : "") +
        (sessionId ? "&sessionId=" + encodeURIComponent(sessionId) : workspace ? "&workspace=" + encodeURIComponent(workspace) : "");
      return fetch(q, { method: "POST", body: a.file })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error) throw new Error(a.name + ": " + d.error);
          a.path = d.path; a.type = d.type;
          return a;
        });
    }));
  }
  function fileChips(list) {
    var r = el("div", "msg-files");
    list.forEach(function (a) { r.appendChild(el("span", "file-chip", a.name)); });
    return r;
  }
  $("attachBtn").onclick = function () { $("fileInput").click(); };
  // 🧬 opens a fresh chat rooted in the harness source with self-evolve on. The chat
  // is created by its first message, so an unused one never clutters History.
  $("selfEvolveToggle").onclick = function () {
    if (S.busy || S.contextSaving) return;
    get("/api/self" + qs()).then(function (d) {
      setView("chat");
      if (!d || d.error || !d.sourceRoot) {
        sysline("⚠ No harness source folder found — set it under 🧬 ▾.", "error");
        return;
      }
      if (S.selfEvolve && S.workspace === d.sourceRoot) { $("task").focus(); return; } // already in one
      $("newSession").click();
      S.workspace = d.sourceRoot; S.selfEvolve = true; refreshChatContext();
      sysline("🧬 Self-evolve chat · working folder " + shortPath(d.sourceRoot), "route");
      $("task").focus();
    }).catch(function () { sysline("⚠ Could not reach the harness.", "error"); });
  };
  // The options panel lives on <body> so the rail's overflow can't clip it.
  (function () {
    var o = el("div"); o.id = "selfChatOptions"; o.hidden = true; document.body.appendChild(o);
    // content arrives async; keep the panel placed as it grows
    if (window.ResizeObserver) new ResizeObserver(function () { if (!o.hidden) placeSelfOptions(); }).observe(o);
    window.addEventListener("resize", function () { if (!o.hidden) placeSelfOptions(); });
  })();
  /** Open above the ▾ when there's room (sidebar footer), otherwise below (narrow layout, rail on top). */
  function placeSelfOptions() {
    var host = $("selfChatOptions"), r = $("selfChatDetails").getBoundingClientRect();
    var gap = 10, edge = 12;
    host.style.left = Math.max(edge, Math.min(r.left - 200, window.innerWidth - host.offsetWidth - edge)) + "px";
    var above = r.top - gap - edge, below = window.innerHeight - r.bottom - gap - edge;
    var wanted = Math.min(host.scrollHeight, window.innerHeight * 0.55);
    if (above >= wanted || above >= below) {
      host.style.top = ""; host.style.bottom = (window.innerHeight - r.top + gap) + "px";
      host.style.maxHeight = Math.max(160, above) + "px";
    } else {
      host.style.bottom = ""; host.style.top = (r.bottom + gap) + "px";
      host.style.maxHeight = Math.max(160, below) + "px";
    }
  }
  $("selfChatDetails").addEventListener("toggle", function () {
    var host = $("selfChatOptions");
    if (this.open) { host.hidden = false; renderSelfChatOptions(); placeSelfOptions(); }

  function handle(evt, turn) {
    // `accepted` is protocol metadata, not presentation. Keep an immutable
    // turn bound to its server session even if its UI was detached by New.
    if (evt.t === "accepted") {
      turn.sessionId = evt.session;

      }

    var pill = turn.pill, bubble = turn.bubble, body = turn.body, tw = turn.tw;
    if (evt.t === "route") {

      var d = evt.decision;

  // ---------- accounts (subscription logins) ----------
  var AUTH = [
    { id: "claude", title: "Claude", button: "Log in with Claude", sub: "Claude Code subscription — powers the claude-code models." },
    { id: "chatgpt", title: "ChatGPT", button: "Log in with ChatGPT", sub: "ChatGPT plan through the Codex CLI — powers the codex models." }

  var authPoll = null, authCards = null, authSeen = {};

  function accountsSection() {
    var box = el("div", "accounts");
    box.appendChild(el("div", "nav-section-label", "Accounts · profile " + (S.profile || "home")));
    var grid = el("div", "grid2");
    var cards = {};
    AUTH.forEach(function (a) {
      var c = el("div", "card authcard");

      cards[a.id] = k;
      grid.appendChild(c);
    });
    box.appendChild(grid);
    authCards = cards;
    // Settings can re-render mid sign-in; resume polling for whatever the server says is pending.
    refreshAuth(cards).then(function (d) {
      if (AUTH.some(function (a) { return d[a.id] && d[a.id].pending && !d[a.id].loggedIn; })) pollAuth();
    });

  }

  function paintAuth(k, st) {
    if (!st) return;
    authSeen[k.a.id] = !!st.loggedIn;
    var waiting = !st.loggedIn && (st.pending || k.busy);
    k.state.className = "auth-state" + (st.loggedIn ? " ok" : waiting ? " wait" : "");
    k.state.textContent = st.loggedIn ? "Connected" : waiting ? "Waiting for sign-in" : "Not connected";
    k.detail.textContent = st.loggedIn && st.detail ? st.detail : k.a.sub;
    if (st.loggedIn) {
      k.busy = false;
      k.btn.className = "ghost auth-btn"; k.btn.textContent = "Reconnect";
      k.help.hidden = true; k.help.textContent = "";
    } else if (!k.busy) {
      k.btn.className = "btn-send auth-btn"; k.btn.textContent = k.a.button;
    }
  }

  function refreshAuth(cards) {
    return get("/api/auth/status" + qs()).then(function (d) {
      AUTH.forEach(function (a) { paintAuth(cards[a.id], d[a.id]); });
      return d;
    });
  }

  function beginLogin(k, cards) {
    k.busy = true; k.btn.disabled = true; k.btn.textContent = "Starting…";
    k.help.hidden = true; k.help.textContent = "";
    fetch("/api/auth/login" + qs(), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ provider: k.a.id }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        k.btn.disabled = false;
        k.help.hidden = false;
        if (d.error || (!d.url && d.done)) {
          k.busy = false;
          k.btn.className = "btn-send auth-btn"; k.btn.textContent = k.a.button;
          k.help.appendChild(el("div", "auth-err", d.error || d.output || "Sign-in could not start."));
          return;
        }
        k.btn.className = "ghost auth-btn"; k.btn.textContent = "Restart sign-in";
        paintAuth(k, { loggedIn: false, pending: true });
        k.help.appendChild(el("div", null, "A browser tab should open — finish signing in there. This card updates on its own."));
        if (d.url) {
          var link = el("a", "auth-link", "Open the sign-in page");
          link.href = d.url; link.target = "_blank"; link.rel = "noopener noreferrer";
          k.help.appendChild(link);
        }
        if (k.a.id === "claude") {
          k.help.appendChild(el("div", null, "If the page shows a code, paste it here:"));
          var codeRow = el("div", "auth-code");
          var input = el("input"); input.type = "text"; input.placeholder = "Authentication code"; input.autocomplete = "off";
          var send = el("button", "ghost", "Submit code"); send.type = "button";
          var note = el("div", "auth-note");
          send.onclick = function () {
            if (!input.value.trim()) return;
            send.disabled = true;
            fetch("/api/auth/code" + qs(), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: input.value }) })
              .then(function (r) { return r.json(); })
              .then(function (res) {
                send.disabled = false;
                note.className = res.error ? "auth-err" : "auth-note";
                note.textContent = res.error || "Code sent — checking…";
                if (!res.error) input.value = "";
              });
          };
          input.onkeydown = function (e) { if (e.key === "Enter") send.click(); };
          codeRow.appendChild(input); codeRow.appendChild(send);
          k.help.appendChild(codeRow); k.help.appendChild(note);
        }
        pollAuth(cards);
      })
      .catch(function (err) {
        k.busy = false; k.btn.disabled = false; k.btn.textContent = k.a.button;
        k.help.hidden = false; k.help.appendChild(el("div", "auth-err", String(err)));
      });
  }

  function pollAuth() {
    if (authPoll) clearInterval(authPoll);
    var until = Date.now() + 10 * 60 * 1000, connected = false;
    authPoll = setInterval(function () {
      if (S.view !== "settings" || Date.now() > until || !authCards) {
        clearInterval(authPoll); authPoll = null; return;
      }
      var cards = authCards, was = {};
      AUTH.forEach(function (a) { was[a.id] = authSeen[a.id]; });
      refreshAuth(cards).then(function (d) {
        var waiting = false;
        AUTH.forEach(function (a) {
          var st = d[a.id] || {}, k = cards[a.id];
          if (st.loggedIn && was[a.id] === false) connected = true;
          if (!st.loggedIn && k.busy && !st.pending) {
            // the CLI exited without a login (closed tab, bad code, timeout)
            k.busy = false; paintAuth(k, st);
            k.help.hidden = false; k.help.appendChild(el("div", "auth-err", "Sign-in ended without connecting — try again."));
          }
          if (!st.loggedIn && (st.pending || k.busy)) waiting = true;
        });
        if (!waiting) {
          clearInterval(authPoll); authPoll = null;
          // refresh fleet chips once, after sign-in settles (this re-renders Settings)
          if (connected) loadStatus();
        }
      });
    }, 2500);
  }

      // Keep crash-journal deltas at their original chronological position.
      // A later final event upgrades that same bubble instead of duplicating it.
      var pendingTurns = {}, finalizedTurns = {}, replayTurns = {}, lastAssistant = null;
      function replayTurn(turnId, e) {
        var existing = turnId && (pendingTurns[turnId] || replayTurns[turnId]);
        if (existing) return existing;
        if (!turnId) return lastAssistant;
        var bubble = el("div", "msg assistant");
        bubble.appendChild(el("div", "pill", e.model || e.provider || "tool activity"));
        var answer = el("div", "answer"); bubble.appendChild(answer); feed.appendChild(bubble);
        var turn = { bubble: bubble, answer: answer, text: "" };
        pendingTurns[turnId] = turn; replayTurns[turnId] = turn; lastAssistant = turn;
        return turn;
      }
      (d.events || []).forEach(function (e) {
        if (e.kind === "assistant-delta") {
          if (!e.turnId || finalizedTurns[e.turnId]) return;
          var pending = pendingTurns[e.turnId];

            bubble.appendChild(el("div", "pill", e.model || e.provider || "interrupted turn"));
            var answer = el("div", "answer"); bubble.appendChild(answer);

            feed.appendChild(bubble);
            pending = pendingTurns[e.turnId] = { bubble: bubble, answer: answer, text: "" };
            replayTurns[e.turnId] = pending; lastAssistant = pending;
          }
          pending.text += e.text || "";

        } else if (e.kind === "user-message") {

        } else if (e.kind === "assistant-text") {

            var note = done.bubble.querySelector(".turn-note"); if (note) note.remove();

            lastAssistant = e.turnId ? replayTurns[e.turnId] : { bubble: b, answer: finalAnswer, text: e.text };
          }
        } else if (e.kind === "tool-call") {
          var callTurn = replayTurn(e.turnId, e);

        } else if (e.kind === "tool-result") {

      var list = $("fsList"); list.textContent = "";
      if (d.parent) {
        var up = el("button", "fsrow up"); up.textContent = "…";
        up.onclick = function () { fsBrowse(d.parent); };
        list.appendChild(up);
      }
      (d.entries || []).forEach(function (name) {
        var row = el("button", "fsrow");
        row.appendChild(el("span", null, name));
        row.onclick = function () { fsBrowse(d.dir + "/" + name); };
        row.ondblclick = function () { chooseFolder(d.dir + "/" + name); };
        list.appendChild(row);
      });
      if (!(d.entries || []).length) list.appendChild(el("div", "empty", "No folders here"));
    });
  }
  function chooseFolder(path) {
    saveSessionContext({ workspace: path }).then(function () { $("fsOverlay").hidden = true; }).catch(function (err) { $("fsPath").textContent = err.message; });
  }
  function closeFolderPicker() { $("fsOverlay").hidden = true; $("wsBtn").focus(); }
  $("wsBtn").onclick = function () { fsBrowse(S.workspace || "~"); $("fsOverlay").hidden = false; setTimeout(function () { $("fsCancel").focus(); }, 0); };
  $("fsCancel").onclick = closeFolderPicker;
  $("fsHome").onclick = function () { fsBrowse("~"); };
  $("fsChoose").onclick = function () { chooseFolder(S.fsDir); };
  $("fsOverlay").addEventListener("click", function (e) { if (e.target === this) closeFolderPicker(); });
  document.addEventListener("keydown", function (e) {
    if ($("fsOverlay").hidden) return;
    if (e.key === "Escape") closeFolderPicker();
    else trapTab(e, $("fsOverlay"));
  });

  // ---------- status / boot ----------
  function loadUsageChips() { loadStatus(); }
  function loadStatus() {
    var profile = S.profile, sessionId = S.sessionId, statusId = ++S.statusSeq, themeSeq = S.themeSeq;
    var query = (profile ? "?profile=" + encodeURIComponent(profile) : "") + (sessionId ? (profile ? "&" : "?") + "sessionId=" + encodeURIComponent(sessionId) : "");
    return get("/api/status" + query).then(function (d) {
      if (statusId !== S.statusSeq || (profile && profile !== S.profile)) return;
      try {
      if (!S.profile) S.profile = d.profile;
      S.status = d;
      var incomingSettings = d.settings || {};
      S.settings = S.themePinned || themeSeq !== S.themeSeq ? { ...incomingSettings, ...S.settings } : { ...S.settings, ...incomingSettings };
      if (!S.themePinned && themeSeq === S.themeSeq && document.documentElement.dataset.theme !== S.settings.theme) applyTheme(S.settings.theme);
      applyReasoning();
      renderModelPick();
      // Ignore context-bearing status replies after navigation. A blank chat
      // receives only its profile default, never a previous chat's folder.
      if (sessionId === S.sessionId) {
        S.defaultWorkspace = d.defaultWorkspace || d.workspace || S.defaultWorkspace;
        if (!sessionId) { S.workspace = d.defaultWorkspace || d.workspace || S.workspace; S.selfEvolve = false; }
      }
      refreshChatContext();
      $("profilePill").textContent = d.profile;
      var pills = $("pills"); pills.textContent = "";
      (d.profiles || []).forEach(function (pr) {
        var b = el("button", "pill" + (pr === d.profile ? " active" : ""), pr);
        b.onclick = function () {
          detachActiveTurn(); S.bootSeq++; invalidateContext(); S.profile = pr; S.sessionId = null; S.workspace = null; S.selfEvolve = false; S.fresh = false; S.loadSeq++; feed.textContent = "";
          loadStatus(); loadChatList();
        };
        pills.appendChild(b);
      });
      var chips = $("chips"); chips.textContent = "";
      var pin = $("pin");
      var prev = pin.value;
      pin.textContent = "";
      var auto = el("option"); auto.value = ""; auto.textContent = "AUTO"; pin.appendChild(auto);
      S.models = [];
      (d.providers || []).concat((d.providersExtras || []).length ? [{ id: "custom", ok: true, detail: "registered models (provider key may be missing)", models: d.providersExtras }] : []).forEach(function (p) {
        var chip = el("span", "chip " + (p.ok ? "ok" : "fail"));
        chip.appendChild(el("span", "dot"));
        chip.appendChild(el("span", null, p.id));
        var mini = el("div", "mini");
        (p.models || []).forEach(function (m) {
          S.models.push(m);
          var row = el("div", "row");
          var nm = el("span", null, m.id);
          row.appendChild(nm);
          if (m.orchestratorOnly) row.appendChild(el("span", "tag orchestrator-only", "orchestrator"));
          mini.appendChild(row);
          var o = el("option"); o.value = m.id; o.textContent = m.id;
          if (m.orchestratorOnly && !S.settings.astraAvailable) o.disabled = true;
          pin.appendChild(o);
        });
        if (!p.ok) mini.insertBefore(el("div", null, p.detail), mini.firstChild);
        chip.appendChild(mini);
        chips.appendChild(chip);
      });
      pin.value = prev && [...pin.options].some(function (o) { return o.value === prev; }) ? prev : "";
      renderModelPick();
      document.querySelector(".chk.astra-only").hidden = !S.settings.astraAvailable;
      if (S.view === "settings") renderView();
      } catch (err) { feed.appendChild(el("div", "sys error", "status render failed: " + err.message)); throw err; }
    }).catch(function (e) { feed.appendChild(el("div", "sys error", "status fetch failed: " + e.message)); });
  }

  // ---------- signature: the logo reads "agentic."; hover types "sidekick" in ----------
  (function () {
    var sig = $("brandSig"), domain = $("sigDomain");
    var full = "sidekick", n = 0, timer = null;
    function render() { domain.textContent = full.slice(0, n); }
    function step(forward) {
      clearInterval(timer);
      timer = setInterval(function () {
        if (forward ? n < full.length : n > 0) { n += forward ? 1 : -1; render(); }
        else clearInterval(timer);
      }, forward ? 45 : 28);
    }
    function typeIn() { sig.classList.add("is-hovered"); step(true); }
    function typeOut() { sig.classList.remove("is-hovered"); step(false); }
    sig.addEventListener("mouseenter", typeIn);
    sig.addEventListener("mouseleave", typeOut);
    // Keyboard reach: the name is decorative, so focus reveals it the same way.
    sig.addEventListener("focus", typeIn);
    sig.addEventListener("blur", typeOut);
    sig.addEventListener("click", function (e) { e.preventDefault(); });
    render();
  })();

  // ---------- ambient: cursor glow ----------
  (function () {
    var raf = 0;
    addEventListener("pointermove", function (e) {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        document.documentElement.style.setProperty("--mx", e.clientX + "px");
        document.documentElement.style.setProperty("--my", e.clientY + "px");
        raf = 0;
      });
    });
  })();

  // ---------- halftone ripple lattice (superseded) ----------

  get("/api/meta").then(function (d) {
    S.meta = d; S.verbs = (d.verbs || []).length ? d.verbs : ["Crystallizing"];
    S.settings = d.settings || S.settings;
    applyTheme(S.settings.theme);
    applyReasoning();
  }).catch(function () { S.verbs = ["Crystallizing"]; });
  window.__ls = loadStatus; window.__S = S;
  var initialBoot = ++S.bootSeq;
  loadStatus().then(function () {
    if (initialBoot === S.bootSeq && S.profile) hydrateHistory(initialBoot);
  });
  setView("chat");
})();
</script>
</body>
</html>
